name: Verify NowTuneUp 1.17.0 published APK once

on:
  push:
    branches:
      - automation/release-1.17.0
    paths:
      - .github/workflows/verify-release-1.17.0-once.yml

permissions:
  contents: read

jobs:
  verify-published-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      APK: NowTuneUp-v1.17.0-release.apk
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 45fada15d6b022af5bab44e61b328fa09d9009bf

      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 13114758
          packages: 'platform-tools build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Download published release assets
        run: |
          set -euo pipefail
          mkdir -p verify
          gh release download v1.17.0 --repo ${{ github.repository }} --dir verify --pattern "$APK" --pattern "$APK.sha256"
          test -s "verify/$APK"
          test -s "verify/$APK.sha256"

      - name: Verify published checksum
        working-directory: verify
        run: sha256sum -c "$APK.sha256"

      - name: Verify Android signing certificate
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "verify/$APK"

      - name: Verify package version
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -x "$AAPT"
          BADGING="$("$AAPT" dump badging "verify/$APK" | head -n 1)"
          echo "$BADGING"
          grep -Fq "versionCode='27'" <<< "$BADGING"
          grep -Fq "versionName='1.17.0'" <<< "$BADGING"
