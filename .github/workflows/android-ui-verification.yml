name: Android UI verification
on:
  pull_request:
    paths:
      - 'android-app/**'
      - '.github/workflows/android-ui-verification.yml'
permissions:
  contents: read
concurrency:
  group: android-ui-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  source-and-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Build source, run unit tests and lint
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest --stacktrace --no-daemon
      - name: Enable emulator acceleration
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify Compose behavior on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_3a
          disable-animations: true
          working-directory: android-app
          script: |
            ./gradlew connectedDebugAndroidTest --stacktrace --no-daemon
            adb shell am start -n com.nowtuneup.app.debug/com.nowtuneup.app.MainActivity
            sleep 3
            mkdir -p app/build/review
            adb exec-out screencap -p > app/build/review/first-run.png
      - name: Upload test reports and UI test APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NowTuneUp-1.15.0-ui-verification
          path: |
            android-app/app/build/reports/
            android-app/app/build/outputs/apk/debug/
            android-app/app/build/outputs/androidTest-results/
            android-app/app/build/review/
          if-no-files-found: ignore
