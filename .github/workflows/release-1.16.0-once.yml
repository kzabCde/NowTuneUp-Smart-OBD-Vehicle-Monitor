name: Release NowTuneUp 1.16.0 once

on:
  push:
    branches:
      - automation/release-1.16.0
    paths:
      - .github/workflows/release-1.16.0-once.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      RELEASE_VERSION: 1.16.0
      RELEASE_NOTES: docs/releases/v1.16.0.md
      TARGET_SHA: c4f5cfcc6a5df652b34c5eee742257fea6188024
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c4f5cfcc6a5df652b34c5eee742257fea6188024
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 13114758
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Validate release version
        working-directory: android-app
        run: |
          set -euo pipefail
          grep -Fq "versionName = \"$RELEASE_VERSION\"" app/build.gradle.kts
          test -f "../$RELEASE_NOTES"
          chmod +x gradlew

      - name: Test and lint
        working-directory: android-app
        run: ./gradlew test lint --stacktrace --no-daemon

      - name: Restore signing key
        working-directory: android-app
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/nowtuneup.jks"

      - name: Build signed release APK
        working-directory: android-app
        env:
          NTU_KEYSTORE_FILE: ${{ runner.temp }}/nowtuneup.jks
          NTU_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NTU_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NTU_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Name, checksum and verify artifact
        run: |
          set -euo pipefail
          scripts/rename-apk.sh "$RELEASE_VERSION"
          scripts/calculate-checksum.sh "android-app/app/build/outputs/apk/release/NowTuneUp-v${RELEASE_VERSION}-release.apk"
          scripts/verify-release.sh "android-app/app/build/outputs/apk/release/NowTuneUp-v${RELEASE_VERSION}-release.apk"

      - name: Create release tag on merged commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin "refs/tags/v${RELEASE_VERSION}" >/dev/null 2>&1; then
            echo "Tag v${RELEASE_VERSION} already exists"
          else
            git tag -a "v${RELEASE_VERSION}" "$TARGET_SHA" -m "NowTuneUp v${RELEASE_VERSION}"
            git push origin "refs/tags/v${RELEASE_VERSION}"
          fi

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.RELEASE_VERSION }}
          name: NowTuneUp v${{ env.RELEASE_VERSION }}
          body_path: ${{ env.RELEASE_NOTES }}
          generate_release_notes: true
          files: |
            android-app/app/build/outputs/apk/release/NowTuneUp-v${{ env.RELEASE_VERSION }}-release.apk
            android-app/app/build/outputs/apk/release/NowTuneUp-v${{ env.RELEASE_VERSION }}-release.apk.sha256
