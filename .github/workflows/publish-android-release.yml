name: Publish Android release
on:
  push:
    tags: ['v*']
    branches: ['release/publish-v*']
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version to publish (without the v prefix)
        required: true
        default: 1.19.1
        type: string
permissions: { contents: write, pull-requests: write }
concurrency:
  group: android-production-release
  cancel-in-progress: false
jobs:
  release:
    outputs:
      version: ${{ steps.version.outputs.version }}
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: android-app } }
    env:
      RELEASE_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17', cache: gradle }
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 13114758
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - run: chmod +x gradlew
      - name: Validate release version
        id: version
        run: |
          VERSION="${RELEASE_INPUT#release/publish-}"
          VERSION="${VERSION#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid semantic version: $VERSION"; exit 1; }
          grep -Fq "versionName = \"$VERSION\"" app/build.gradle.kts || {
            echo "Android versionName does not match release $VERSION"
            exit 1
          }
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "RELEASE_NOTES=docs/releases/v${VERSION}.md" >> "$GITHUB_ENV"
          test -f "../docs/releases/v${VERSION}.md" || {
            echo "Release notes are missing for v$VERSION"
            exit 1
          }
      - name: Refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$RELEASE_VERSION" > "$RUNNER_TEMP/release-probe.json" 2> "$RUNNER_TEMP/release-probe.error"; then
            echo "Release v$RELEASE_VERSION already exists; refusing to overwrite it." >&2
            exit 1
          elif ! grep -q 'HTTP 404' "$RUNNER_TEMP/release-probe.error"; then
            cat "$RUNNER_TEMP/release-probe.error" >&2
            exit 1
          fi
      - name: Require configured production signing credentials
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.NTU_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.NTU_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.NTU_KEY_PASSWORD }}
        run: |
          if test -n "$KEYSTORE" || test -s keystore/nowtuneup-web-release.jks; then
            echo 'Production keystore: available'
          else
            echo 'Production keystore: missing' >&2
            exit 1
          fi
          for binding in STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if test -n "${!binding}"; then echo "$binding: configured"; else echo "$binding: missing" >&2; fi
          done
          test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || {
            echo 'Production signing secrets are required; no unsigned APK will be published.' >&2
            exit 1
          }
      - name: Build the immutable release tag source
        working-directory: .
        run: |
          set -euo pipefail
          # Checkout can create a lightweight local ref for an annotated tag.
          # Fetch only into FETCH_HEAD to avoid replacing that local tag ref.
          git fetch --no-tags origin "refs/tags/v$RELEASE_VERSION"
          git checkout --detach FETCH_HEAD
      - name: Compile and test all release sources
        run: ./gradlew test assembleDebugAndroidTest --max-workers=2
      - name: Lint compiled sources
        run: ./gradlew lintDebug lintRelease --max-workers=2
      - name: Restore signing key
        env: { KEYSTORE_B64: '${{ secrets.ANDROID_KEYSTORE_BASE64 }}' }
        run: |
          set -euo pipefail
          if test -n "$KEYSTORE_B64"; then
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/nowtuneup.jks"
          else
            cp keystore/nowtuneup-web-release.jks "$RUNNER_TEMP/nowtuneup.jks"
          fi
      - name: Build signed release APK
        env:
          NTU_KEYSTORE_FILE: ${{ runner.temp }}/nowtuneup.jks
          NTU_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.NTU_KEYSTORE_PASSWORD }}
          NTU_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.NTU_KEY_ALIAS }}
          NTU_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.NTU_KEY_PASSWORD }}
        run: ./gradlew assembleRelease
      - name: Name and checksum artifact
        working-directory: .
        run: |
          scripts/rename-apk.sh "$RELEASE_VERSION"
          scripts/calculate-checksum.sh "android-app/app/build/outputs/apk/release/NowTuneUp-v${RELEASE_VERSION}-release.apk"
          scripts/verify-release.sh "android-app/app/build/outputs/apk/release/NowTuneUp-v${RELEASE_VERSION}-release.apk"
      - name: Verify production signing identity and APK metadata
        working-directory: .
        run: |
          python3 scripts/sync-website-release.py --verify-only --version "$RELEASE_VERSION" \
            --apk "android-app/app/build/outputs/apk/release/NowTuneUp-v${RELEASE_VERSION}-release.apk" --sdk-root "$ANDROID_HOME"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.RELEASE_VERSION }}
          name: NowTuneUp v${{ env.RELEASE_VERSION }}
          body_path: ${{ env.RELEASE_NOTES }}
          generate_release_notes: true
          files: |
            android-app/app/build/outputs/apk/release/NowTuneUp-v${{ env.RELEASE_VERSION }}-release.apk
            android-app/app/build/outputs/apk/release/NowTuneUp-v${{ env.RELEASE_VERSION }}-release.apk.sha256

  website:
    needs: release
    uses: ./.github/workflows/build-bundled-apk.yml
    with:
      version: ${{ needs.release.outputs.version }}
    secrets: inherit
