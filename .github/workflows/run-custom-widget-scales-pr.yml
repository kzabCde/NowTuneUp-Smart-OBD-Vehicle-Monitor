name: Run custom widget scale patch

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/custom-widget-scales.yml
      - .github/workflows/run-custom-widget-scales-pr.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.event.pull_request.head.ref == 'agent/custom-widget-ranges'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Extract and run patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/custom-widget-scales.yml').read_text()
          start = text.index("          python3 <<'PY'\n") + len("          python3 <<'PY'\n")
          end = text.index("\n          PY\n", start)
          lines = text[start:end].splitlines()
          code = "\n".join(line[10:] if line.startswith("          ") else line for line in lines) + "\n"
          Path('/tmp/custom-widget-scales.py').write_text(code)
          PY
          python3 /tmp/custom-widget-scales.py

      - name: Test, lint, and build debug APK
        working-directory: android-app
        run: |
          chmod +x gradlew
          ./gradlew clean test lint assembleDebug

      - name: Commit implementation
        shell: bash
        run: |
          rm .github/workflows/custom-widget-scales.yml
          rm .github/workflows/run-custom-widget-scales-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add configurable widget value ranges"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
