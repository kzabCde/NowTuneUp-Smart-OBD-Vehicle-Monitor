name: Run custom widget scale patch

on:
  pull_request:
    branches: [main]
    paths:
      - .github/scripts/apply_custom_widget_scales.py
      - .github/workflows/custom-widget-scales.yml
      - .github/workflows/run-custom-widget-scales-pr.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.event.pull_request.head.ref == 'agent/custom-widget-ranges'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Apply custom scale support
        run: python3 .github/scripts/apply_custom_widget_scales.py

      - name: Test, lint, and build debug APK
        working-directory: android-app
        run: |
          chmod +x gradlew
          ./gradlew clean test lint assembleDebug

      - name: Commit implementation
        shell: bash
        run: |
          rm .github/scripts/apply_custom_widget_scales.py
          rm .github/workflows/custom-widget-scales.yml
          rm .github/workflows/run-custom-widget-scales-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add configurable widget value ranges"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
