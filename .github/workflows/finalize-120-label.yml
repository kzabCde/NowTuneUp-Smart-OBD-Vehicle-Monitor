name: Finalize 1.2.0 version label

on:
  push:
    branches:
      - release/1.2.0
    paths:
      - .github/workflows/finalize-120-label.yml

permissions:
  contents: write

jobs:
  update-label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/1.2.0
          fetch-depth: 0
      - name: Update version label and remove helper workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android-app/app/src/main/java/com/nowtuneup/app/MainActivity.kt")
          text = path.read_text()
          old = "NTU 1.1.1 • Android 8+ • Local-first • Read-only OBD-II"
          new = "NTU 1.2.0 • Android 8+ • Local-first • Read-only OBD-II"
          if old not in text:
              raise SystemExit("Expected 1.1.1 label was not found")
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/finalize-120-label.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-app/app/src/main/java/com/nowtuneup/app/MainActivity.kt .github/workflows/finalize-120-label.yml
          git commit -m "Update in-app release label to 1.2.0"
          git push origin HEAD:release/1.2.0
