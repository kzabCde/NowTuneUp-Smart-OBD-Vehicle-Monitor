name: Diagnose revised 1.6.1 release

on:
  push:
    branches:
      - release/1.6.1-bluetooth-realtime-stability
    paths:
      - android-app/**
      - .github/workflows/diagnose-release-161.yml

permissions:
  contents: write

concurrency:
  group: diagnose-release-161-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose-and-bundle:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NTU_KEYSTORE_FILE: ${{ github.workspace }}/android-app/keystore/nowtuneup-web-release.jks
      NTU_KEYSTORE_PASSWORD: ${{ secrets.NTU_KEYSTORE_PASSWORD }}
      NTU_KEY_ALIAS: ${{ secrets.NTU_KEY_ALIAS }}
      NTU_KEY_PASSWORD: ${{ secrets.NTU_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Record signing prerequisites
        shell: bash
        run: |
          mkdir -p ci
          {
            echo "release=1.6.1"
            echo "version_code=12"
            if test -s "$NTU_KEYSTORE_FILE"; then echo "keystore_present=true"; else echo "keystore_present=false"; fi
            if test -n "$NTU_KEYSTORE_PASSWORD"; then echo "store_password_present=true"; else echo "store_password_present=false"; fi
            if test -n "$NTU_KEY_ALIAS"; then echo "key_alias_present=true"; else echo "key_alias_present=false"; fi
            if test -n "$NTU_KEY_PASSWORD"; then echo "key_password_present=true"; else echo "key_password_present=false"; fi
          } > ci/release-1.6.1-status.txt

      - name: Test lint and assemble signed release
        id: build
        continue-on-error: true
        working-directory: android-app
        shell: bash
        run: |
          chmod +x gradlew
          set +e
          ./gradlew test lint assembleRelease
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Verify and bundle successful APK
        if: steps.build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="android-app/app/build/outputs/apk/release/NowTuneUp-v1.6.1-release.apk"
          TARGET="web/public/downloads/NowTuneUp.apk"
          test -s "$SOURCE"
          unzip -t "$SOURCE" >/dev/null
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$SOURCE"
          mkdir -p "$(dirname "$TARGET")"
          cp "$SOURCE" "$TARGET"
          SHA256="$(sha256sum "$TARGET" | awk '{print $1}')"
          SIZE="$(stat -c%s "$TARGET")"
          PUBLISHED_AT="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          python3 - "$SHA256" "$SIZE" "$PUBLISHED_AT" <<'PY'
          from pathlib import Path
          import re
          import sys

          sha256, size, published_at = sys.argv[1], int(sys.argv[2]), sys.argv[3]
          path = Path("web/lib/local-release.ts")
          text = path.read_text()
          text = re.sub(r'version: "[^"]+",', 'version: "1.6.1",', text)
          text = re.sub(r'tagName: "[^"]+",', 'tagName: "v1.6.1",', text)
          text = re.sub(r'versionCode: \d+,', 'versionCode: 12,', text)
          text = re.sub(r'apkSize: \d+,', f'apkSize: {size},', text)
          text = re.sub(r'sha256: (?:null|"[a-f0-9]{64}"),', f'sha256: "{sha256}",', text)
          text = re.sub(r'publishedAt: "[^"]+",', f'publishedAt: "{published_at}",', text)
          text = re.sub(
              r'releaseNotes: "[^"]*",',
              'releaseNotes: "Revised Bluetooth stability build. Uses cancellable non-blocking RFCOMM reads, a longer quiet-window drain for late ELM327 responses, insecure-to-secure SPP fallback, optional adaptive ELM timing, faster priority polling and soft command-stream resynchronization before a full reconnect. Premium gauges, dashboards, USB, Turbo, HUD, DTC and saved settings remain unchanged.",',
              text,
          )
          path.write_text(text)
          PY
          {
            echo "build_outcome=success"
            echo "apk_verified=true"
            echo "apk_size=$SIZE"
            echo "sha256=$SHA256"
          } >> ci/release-1.6.1-status.txt

      - name: Record failed build without exposing secrets
        if: steps.build.outcome != 'success'
        shell: bash
        run: |
          {
            echo "build_outcome=failure"
            echo "gradle_exit_code=${{ steps.build.outputs.exit_code }}"
            echo "apk_verified=false"
          } >> ci/release-1.6.1-status.txt

      - name: Commit diagnostic status and successful bundle
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci/release-1.6.1-status.txt
          if test -s web/public/downloads/NowTuneUp.apk && grep -q '^build_outcome=success$' ci/release-1.6.1-status.txt; then
            git add -f web/public/downloads/NowTuneUp.apk web/lib/local-release.ts
          fi
          git commit -m "Record revised 1.6.1 release build status"
          git push

      - name: Fail workflow when release build failed
        if: steps.build.outcome != 'success'
        shell: bash
        run: exit 1
