name: Build bundled website APK

# NowTuneUp 1.6.1 Bluetooth realtime stability hotfix pipeline.
# Manual production bundle trigger: 2026-08-02
on:
  workflow_dispatch:
  push:
    branches:
      - 'release/**'
      - 'hotfix/**'
    paths:
      - android-app/**
      - .github/workflows/build-bundled-apk.yml

permissions:
  contents: write

concurrency:
  group: bundled-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Sync in-app version label
        run: |
          sed -Ei 's/NTU [0-9]+\.[0-9]+\.[0-9]+/NTU 1.6.1/g' android-app/app/src/main/java/com/nowtuneup/app/ui/screens/NtuScreens.kt

      - name: Build and sign APK 1.6.1
        working-directory: android-app
        env:
          NTU_KEYSTORE_FILE: ${{ github.workspace }}/android-app/keystore/nowtuneup-web-release.jks
          NTU_KEYSTORE_PASSWORD: ${{ secrets.NTU_KEYSTORE_PASSWORD }}
          NTU_KEY_ALIAS: ${{ secrets.NTU_KEY_ALIAS }}
          NTU_KEY_PASSWORD: ${{ secrets.NTU_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew test lint assembleRelease

      - name: Verify and bundle APK with website
        run: |
          set -euo pipefail
          SOURCE="android-app/app/build/outputs/apk/release/NowTuneUp-v1.6.1-release.apk"
          TARGET="web/public/downloads/NowTuneUp.apk"
          test -s "$SOURCE"
          unzip -t "$SOURCE" >/dev/null
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$SOURCE"
          mkdir -p "$(dirname "$TARGET")"
          cp "$SOURCE" "$TARGET"
          SHA256="$(sha256sum "$TARGET" | awk '{print $1}')"
          SIZE="$(stat -c%s "$TARGET")"
          PUBLISHED_AT="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          python3 - "$SHA256" "$SIZE" "$PUBLISHED_AT" <<'PY'
          from pathlib import Path
          import re
          import sys

          sha256, size, published_at = sys.argv[1], int(sys.argv[2]), sys.argv[3]
          path = Path("web/lib/local-release.ts")
          text = path.read_text()
          text = re.sub(r'version: "[^"]+",', 'version: "1.6.1",', text)
          text = re.sub(r'tagName: "[^"]+",', 'tagName: "v1.6.1",', text)
          text = re.sub(r'versionCode: \d+,', 'versionCode: 11,', text)
          text = re.sub(r'apkSize: \d+,', f'apkSize: {size},', text)
          text = re.sub(r'sha256: (?:null|"[a-f0-9]{64}"),', f'sha256: "{sha256}",', text)
          text = re.sub(r'publishedAt: "[^"]+",', f'publishedAt: "{published_at}",', text)
          text = re.sub(
              r'releaseNotes: "[^"]*",',
              'releaseNotes: "Improves Bluetooth ELM327 realtime stability with interleaved priority polling, shorter live PID deadlines, no long live-data retries, stale-response recovery, sustained-failure reconnect thresholds and commands-per-second diagnostics. Premium gauges, dashboards, USB, Turbo, HUD, DTC and saved settings remain unchanged.",',
              text,
          )
          path.write_text(text)
          PY
          test "$(sha256sum "$TARGET" | awk '{print $1}')" = "$SHA256"

      - name: Commit generated APK
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f \
            android-app/app/src/main/java/com/nowtuneup/app/ui/screens/NtuScreens.kt \
            web/public/downloads/NowTuneUp.apk \
            web/lib/local-release.ts
          if git diff --cached --quiet; then
            echo "Bundled APK is already current."
            exit 0
          fi
          git commit -m "Bundle NowTuneUp APK 1.6.1 with website"
          git push

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NowTuneUp-1.6.1
          path: web/public/downloads/NowTuneUp.apk
          if-no-files-found: error
