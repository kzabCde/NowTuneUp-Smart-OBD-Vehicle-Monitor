name: Build bundled website APK

on:
  workflow_dispatch:
  push:
    branches:
      - agent/use-bundled-apk-download
    paths:
      - android-app/**
      - .github/workflows/build-bundled-apk.yml

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Build and sign APK 1.0.0
        working-directory: android-app
        env:
          NTU_KEYSTORE_FILE: ${{ github.workspace }}/android-app/keystore/nowtuneup-web-release.jks
          NTU_KEYSTORE_PASSWORD: NowTuneUpWeb100
          NTU_KEY_ALIAS: nowtuneup-web
          NTU_KEY_PASSWORD: NowTuneUpWeb100
        run: |
          chmod +x gradlew
          ./gradlew test lint assembleRelease

      - name: Verify and bundle APK with website
        run: |
          set -euo pipefail
          SOURCE="android-app/app/build/outputs/apk/release/NowTuneUp-v1.0.0-release.apk"
          TARGET="web/public/downloads/NowTuneUp.apk"
          test -s "$SOURCE"
          mkdir -p "$(dirname "$TARGET")"
          cp "$SOURCE" "$TARGET"
          SHA256="$(sha256sum "$TARGET" | awk '{print $1}')"
          SIZE="$(stat -c%s "$TARGET")"
          python3 - "$SHA256" "$SIZE" <<'PY'
          from pathlib import Path
          import sys
          sha256, size = sys.argv[1], int(sys.argv[2])
          path = Path("web/lib/local-release.ts")
          text = path.read_text()
          import re
          text = re.sub(r'apkSize: \d+,', f'apkSize: {size},', text)
          text = re.sub(r'sha256: (?:null|"[a-f0-9]{64}"),', f'sha256: "{sha256}",', text)
          path.write_text(text)
          PY
          test "$(sha256sum "$TARGET" | awk '{print $1}')" = "$SHA256"

      - name: Commit generated APK
        run: |
          if git diff --quiet -- web/public/downloads/NowTuneUp.apk web/lib/local-release.ts; then
            echo "Bundled APK is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/downloads/NowTuneUp.apk web/lib/local-release.ts
          git commit -m "Bundle NowTuneUp APK 1.0.0 with website"
          git push

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NowTuneUp-1.0.0
          path: web/public/downloads/NowTuneUp.apk
          if-no-files-found: error
