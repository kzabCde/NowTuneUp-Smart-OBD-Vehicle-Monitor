name: Sync verified Android release to website
on:
  workflow_dispatch:
    inputs:
      version:
        description: Published stable release version (without v)
        required: true
        default: '1.19.1'
        type: string
  workflow_call:
    inputs:
      version:
        required: true
        type: string
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: website-release-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 13114758
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify published APK and update website facts
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          APK_NAME="NowTuneUp-v${RELEASE_VERSION}-release.apk"
          ASSET_DIR="$RUNNER_TEMP/release-assets"
          mkdir -p "$ASSET_DIR"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$RELEASE_VERSION" > "$ASSET_DIR/release.json"
          gh release download "v$RELEASE_VERSION" --pattern "$APK_NAME" --pattern "$APK_NAME.sha256" --dir "$ASSET_DIR"
          python3 scripts/sync-website-release.py --version "$RELEASE_VERSION" \
            --apk "$ASSET_DIR/$APK_NAME" --sdk-root "$ANDROID_HOME" --release-json "$ASSET_DIR/release.json"
      - name: Validate website
        run: |
          set -euo pipefail
          npm install --package-lock=false --no-audit --no-fund
          npm run typecheck
          npm run lint --workspace=nowtuneup-web -- --ignore-pattern '.next/**'
          npm test
          npm run build
          git restore -- web/next-env.d.ts
      - name: Open website release pull request
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="release/website-v$RELEASE_VERSION"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            echo "Website release branch already exists; preserving it."
            gh pr view "$BRANCH" --json url --jq .url
            exit 0
          fi
          git switch -c "$BRANCH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f web/public/downloads/NowTuneUp.apk
          git add web/lib/local-release.ts
          git diff --cached --quiet && exit 0
          git commit -m "Publish verified website download for v$RELEASE_VERSION"
          git push origin "HEAD:refs/heads/$BRANCH"
          cat > "$RUNNER_TEMP/website-release-pr.md" <<'BODY'
          Updates the website to the verified, published stable APK. Its package/version,
          signing identity, SHA-256, size, publication timestamp and GitHub URL were
          checked before changing the bundled download and displayed metadata.

          Website typecheck, lint, unit tests and production build passed in this job.
          BODY
          gh pr create --base main --head "$BRANCH" --title "Release NowTuneUp $RELEASE_VERSION on the website" --body-file "$RUNNER_TEMP/website-release-pr.md"
