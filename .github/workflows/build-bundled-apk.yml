name: Build bundled website APK

on:
  workflow_dispatch:
  push:
    branches:
      - 'release/**'
    paths:
      - android-app/**
      - .github/workflows/build-bundled-apk.yml

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Build and sign APK 1.1.0
        working-directory: android-app
        env:
          NTU_KEYSTORE_FILE: ${{ github.workspace }}/android-app/keystore/nowtuneup-web-release.jks
          NTU_KEYSTORE_PASSWORD: NowTuneUpWeb100
          NTU_KEY_ALIAS: nowtuneup-web
          NTU_KEY_PASSWORD: NowTuneUpWeb100
        run: |
          chmod +x gradlew
          ./gradlew test lint assembleRelease

      - name: Verify and bundle APK with website
        run: |
          set -euo pipefail
          SOURCE="android-app/app/build/outputs/apk/release/NowTuneUp-v1.1.0-release.apk"
          TARGET="web/public/downloads/NowTuneUp.apk"
          test -s "$SOURCE"
          mkdir -p "$(dirname "$TARGET")"
          cp "$SOURCE" "$TARGET"
          SHA256="$(sha256sum "$TARGET" | awk '{print $1}')"
          SIZE="$(stat -c%s "$TARGET")"
          PUBLISHED_AT="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          python3 - "$SHA256" "$SIZE" "$PUBLISHED_AT" <<'PY'
          from pathlib import Path
          import re
          import sys

          sha256, size, published_at = sys.argv[1], int(sys.argv[2]), sys.argv[3]
          path = Path("web/lib/local-release.ts")
          text = path.read_text()
          text = re.sub(r'version: "[^"]+",', 'version: "1.1.0",', text)
          text = re.sub(r'tagName: "[^"]+",', 'tagName: "v1.1.0",', text)
          text = re.sub(r'versionCode: \d+,', 'versionCode: 2,', text)
          text = re.sub(r'apkSize: \d+,', f'apkSize: {size},', text)
          text = re.sub(r'sha256: (?:null|"[a-f0-9]{64}"),', f'sha256: "{sha256}",', text)
          text = re.sub(r'publishedAt: "[^"]+",', f'publishedAt: "{published_at}",', text)
          text = re.sub(
              r'releaseNotes: "[^"]*",',
              'releaseNotes: "Dashboard customization with Digital, Analog and Hybrid modes, theme presets, editable layouts, threshold colors, Reduce Motion, Driving Mode and adjustable refresh rate.",',
              text,
          )
          path.write_text(text)
          PY
          test "$(sha256sum "$TARGET" | awk '{print $1}')" = "$SHA256"

      - name: Commit generated APK
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f web/public/downloads/NowTuneUp.apk web/lib/local-release.ts
          if git diff --cached --quiet; then
            echo "Bundled APK is already current."
            exit 0
          fi
          git commit -m "Bundle NowTuneUp APK 1.1.0 with website"
          git push

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NowTuneUp-1.1.0
          path: web/public/downloads/NowTuneUp.apk
          if-no-files-found: error
