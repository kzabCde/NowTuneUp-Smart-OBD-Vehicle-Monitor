name: Sync NowTuneUp 1.15.0 APK to website

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-bundled-apk.yml

permissions:
  contents: write

concurrency:
  group: sync-nowtuneup-1-15-0-apk
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: 1.15.0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 13114758
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Download published APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          APK_NAME="NowTuneUp-v${RELEASE_VERSION}-release.apk"
          ASSET_DIR="$RUNNER_TEMP/release-assets"
          mkdir -p "$ASSET_DIR"
          gh release download "v${RELEASE_VERSION}" \
            --pattern "$APK_NAME" \
            --pattern "$APK_NAME.sha256" \
            --dir "$ASSET_DIR" \
            --clobber
          (
            cd "$ASSET_DIR"
            sha256sum -c "$APK_NAME.sha256"
          )
          unzip -t "$ASSET_DIR/$APK_NAME" >/dev/null
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$ASSET_DIR/$APK_NAME"
          mkdir -p web/public/downloads
          cp "$ASSET_DIR/$APK_NAME" web/public/downloads/NowTuneUp.apk
          echo "f0e0fb8c80536ce1307883fbd7defe8fb20f5476d0094a89b7513d31ee75a85c  web/public/downloads/NowTuneUp.apk" | sha256sum -c -

      - name: Commit canonical website APK
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f web/public/downloads/NowTuneUp.apk
          if git diff --cached --quiet; then
            echo "Website APK already matches v${RELEASE_VERSION}."
            exit 0
          fi
          git commit -m "Sync website APK with v${RELEASE_VERSION}"
          git push origin HEAD:main
