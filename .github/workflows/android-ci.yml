name: Android CI
on:
  push:
    branches: [main, work]
  pull_request:
permissions: { contents: write }
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/1.7.2-turbo-timeslip
      - name: Fix invalid internal Compose import and commit source
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          FILE="android-app/app/src/main/java/com/nowtuneup/app/feature/timeslip/TimeSlipScreen.kt"
          sed -i '/^import androidx\.compose\.foundation\.layout\.weight$/d' "$FILE"
          ! grep -q '^import androidx\.compose\.foundation\.layout\.weight$' "$FILE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          if ! git diff --cached --quiet; then
            git commit -m "Fix Time Slip Compose weight import"
            git push origin HEAD:release/1.7.2-turbo-timeslip
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: chmod +x gradlew
      - name: Test, lint, and build debug APK
        run: |
          set -o pipefail
          ./gradlew clean test lint assembleDebug --stacktrace --info 2>&1 | tee gradle-build.log
      - name: Capture debug runtime dependencies after failure
        if: failure()
        run: ./gradlew :app:dependencies --configuration debugRuntimeClasspath --no-daemon --stacktrace > debug-deps.txt 2>&1 || true
      - name: Upload Gradle diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-diagnostics
          path: |
            android-app/gradle-build.log
            android-app/debug-deps.txt
            android-app/build/reports/problems/problems-report.html
          if-no-files-found: ignore
      - name: Upload 1.7.2 UI test APK
        uses: actions/upload-artifact@v4
        with:
          name: NowTuneUp-1.7.2-ui-test
          path: android-app/app/build/outputs/apk/debug/NowTuneUp-v1.7.2-ui-test.apk
          if-no-files-found: error
