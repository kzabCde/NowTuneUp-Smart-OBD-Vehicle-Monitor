name: Android CI
on:
  push:
    branches: [main, work]
  pull_request:
permissions: { contents: read }
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NTU_KEYSTORE_FILE: ${{ github.workspace }}/android-app/keystore/nowtuneup-web-release.jks
      NTU_KEYSTORE_PASSWORD: ${{ secrets.NTU_KEYSTORE_PASSWORD }}
      NTU_KEY_ALIAS: ${{ secrets.NTU_KEY_ALIAS }}
      NTU_KEY_PASSWORD: ${{ secrets.NTU_KEY_PASSWORD }}
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: chmod +x gradlew
      - name: Test, lint, and build debug APK
        run: |
          set -o pipefail
          ./gradlew clean test lint assembleDebug --stacktrace --info 2>&1 | tee gradle-build.log
      - name: Capture debug runtime dependencies after failure
        if: failure()
        run: ./gradlew :app:dependencies --configuration debugRuntimeClasspath --no-daemon --stacktrace > debug-deps.txt 2>&1 || true
      - name: Upload Gradle diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-diagnostics
          path: |
            android-app/gradle-build.log
            android-app/debug-deps.txt
            android-app/build/reports/problems/problems-report.html
          if-no-files-found: ignore
      - name: Upload 1.7.0 UI test APK
        uses: actions/upload-artifact@v4
        with:
          name: NowTuneUp-1.7.0-ui-test
          path: android-app/app/build/outputs/apk/debug/NowTuneUp-v1.7.0-ui-test.apk
          if-no-files-found: error
      - name: Validate release signing prerequisites
        run: |
          test -s "$NTU_KEYSTORE_FILE"
          test -n "$NTU_KEYSTORE_PASSWORD"
          test -n "$NTU_KEY_ALIAS"
          test -n "$NTU_KEY_PASSWORD"
      - name: Build signed 1.7.0 release APK
        run: ./gradlew assembleRelease --stacktrace
      - name: Verify signed release APK
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/NowTuneUp-v1.7.0-release.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          SIZE="$(stat -c%s "$APK")"
          {
            echo "release=1.7.0"
            echo "version_code=14"
            echo "apk_size=$SIZE"
            echo "sha256=$SHA256"
            echo "apksigner_verified=true"
          } > release-1.7.0-status.txt
      - name: Upload signed 1.7.0 release APK
        uses: actions/upload-artifact@v4
        with:
          name: NowTuneUp-1.7.0-release-build-14
          path: |
            android-app/app/build/outputs/apk/release/NowTuneUp-v1.7.0-release.apk
            android-app/release-1.7.0-status.txt
          if-no-files-found: error
