name: Android CI
on:
  push:
    branches: [main, work]
  pull_request:
permissions: { contents: read }
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: android-app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17', cache: gradle }
      - uses: android-actions/setup-android@v3
      - run: chmod +x gradlew
      - run: ./gradlew clean test lint assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: NowTuneUp-debug, path: android-app/app/build/outputs/apk/debug/NowTuneUp-debug.apk, if-no-files-found: error }
