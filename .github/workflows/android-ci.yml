name: Android CI
on:
  push:
    branches: [main, work]
  pull_request:
permissions: { contents: read }
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: chmod +x gradlew
      - name: Test, lint, and build debug APK
        run: |
          set -o pipefail
          ./gradlew clean test lint assembleDebug --stacktrace --info 2>&1 | tee gradle-build.log
      - name: Capture debug runtime dependencies after failure
        if: failure()
        run: ./gradlew :app:dependencies --configuration debugRuntimeClasspath --no-daemon --stacktrace > debug-deps.txt 2>&1 || true
      - name: Upload Gradle diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-diagnostics
          path: |
            android-app/gradle-build.log
            android-app/debug-deps.txt
            android-app/build/reports/problems/problems-report.html
          if-no-files-found: ignore
      - name: Upload Bluetooth test APK
        uses: actions/upload-artifact@v4
        with:
          name: NowTuneUp-1.6.1-bluetooth-test
          path: android-app/app/build/outputs/apk/debug/NowTuneUp-v1.6.1-bluetooth-test.apk
          if-no-files-found: error
