name: Android CI
on:
  push:
    branches: [main, work]
  pull_request:
permissions: { contents: read }
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Export canonical signed 1.7.2 APK from main
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:web/public/downloads/NowTuneUp.apk > NowTuneUp-v1.7.2-release.apk
          test -s NowTuneUp-v1.7.2-release.apk
          unzip -t NowTuneUp-v1.7.2-release.apk >/dev/null
          echo "69dcd5df8f8c711c1f094a6ad2e6d38f73a6e052ff4d3934db666e855c8494e0  NowTuneUp-v1.7.2-release.apk" | sha256sum -c -
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: chmod +x gradlew
      - name: Test, lint, and build debug APK
        run: |
          set -o pipefail
          ./gradlew clean test lint assembleDebug --stacktrace --info 2>&1 | tee gradle-build.log
      - name: Capture debug runtime dependencies after failure
        if: failure()
        run: ./gradlew :app:dependencies --configuration debugRuntimeClasspath --no-daemon --stacktrace > debug-deps.txt 2>&1 || true
      - name: Upload Gradle diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-diagnostics
          path: |
            android-app/gradle-build.log
            android-app/debug-deps.txt
            android-app/build/reports/problems/problems-report.html
          if-no-files-found: ignore
      - name: Upload 1.7.2 UI test APK
        uses: actions/upload-artifact@v4
        with:
          name: NowTuneUp-1.7.2-ui-test
          path: android-app/app/build/outputs/apk/debug/NowTuneUp-v1.7.2-ui-test.apk
          if-no-files-found: error
      - name: Upload canonical signed 1.7.2 release APK
        uses: actions/upload-artifact@v4
        with:
          name: NowTuneUp-1.7.2-main-release
          path: NowTuneUp-v1.7.2-release.apk
          if-no-files-found: error
