name: Android CI
on:
  push:
    branches: [main, work, 'release/**', 'hotfix/**']
  pull_request:
permissions: { contents: read }
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - name: Read application and canonical release metadata
        id: release
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          import re
          local = Path("web/lib/local-release.ts").read_text()
          gradle = Path("android-app/app/build.gradle.kts").read_text()
          def value(text, pattern):
              match = re.search(pattern, text)
              if not match:
                  raise SystemExit(f"Missing release metadata: {pattern}")
              return match.group(1)
          print(f"canonical_version={value(local, r'version: \"([^\"]+)\"')}")
          print(f"canonical_sha256={value(local, r'sha256: \"([a-f0-9]{64})\"')}")
          print(f"app_version={value(gradle, r'versionName = \"([^\"]+)\"')}")
          PY
      - name: Verify canonical signed APK bundle
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          test -s web/public/downloads/NowTuneUp.apk
          unzip -t web/public/downloads/NowTuneUp.apk >/dev/null
          echo "${{ steps.release.outputs.canonical_sha256 }}  web/public/downloads/NowTuneUp.apk" | sha256sum -c -
          cp web/public/downloads/NowTuneUp.apk "NowTuneUp-v${{ steps.release.outputs.canonical_version }}-release.apk"
      - name: Upload canonical signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: NowTuneUp-${{ steps.release.outputs.canonical_version }}-canonical-release
          path: NowTuneUp-v${{ steps.release.outputs.canonical_version }}-release.apk
          if-no-files-found: error
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: chmod +x gradlew
      - name: Test, lint, and build debug APK
        run: |
          set -o pipefail
          ./gradlew clean test lint assembleDebug --stacktrace --info 2>&1 | tee gradle-build.log
      - name: Capture debug runtime dependencies after failure
        if: failure()
        run: ./gradlew :app:dependencies --configuration debugRuntimeClasspath --no-daemon --stacktrace > debug-deps.txt 2>&1 || true
      - name: Upload Gradle diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-diagnostics-${{ steps.release.outputs.app_version }}
          path: |
            android-app/gradle-build.log
            android-app/debug-deps.txt
            android-app/build/reports/problems/problems-report.html
          if-no-files-found: ignore
      - name: Upload UI test APK
        uses: actions/upload-artifact@v4
        with:
          name: NowTuneUp-${{ steps.release.outputs.app_version }}-ui-test
          path: android-app/app/build/outputs/apk/debug/NowTuneUp-v${{ steps.release.outputs.app_version }}-ui-test.apk
          if-no-files-found: error
