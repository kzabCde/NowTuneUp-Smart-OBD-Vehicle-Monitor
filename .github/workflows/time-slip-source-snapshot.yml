name: Apply Time Slip implementation

on:
  pull_request:
    paths:
      - 'ci/time-slip-patch/**'
      - '.github/workflows/time-slip-source-snapshot.yml'
  push:
    branches:
      - feature/1.7.0-time-slip
    paths:
      - 'ci/time-slip-patch/**'
      - '.github/workflows/time-slip-source-snapshot.yml'

permissions:
  contents: write

concurrency:
  group: apply-time-slip-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/1.7.0-time-slip
          fetch-depth: 0
      - name: Apply implementation patch
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f ci/time-slip-patch/ready ]]; then
            echo "Waiting for all Time Slip patch parts."
            exit 0
          fi
          mapfile -t parts < <(find ci/time-slip-patch -maxdepth 1 -type f -name 'part-*' -print | LC_ALL=C sort)
          if (( ${#parts[@]} == 0 )); then
            echo "No patch parts found."
            exit 1
          fi
          printf 'Patch order:\n'
          printf '  %s\n' "${parts[@]}"
          sha256sum "${parts[@]}"
          cat "${parts[@]}" > /tmp/time-slip.patch.gz.b64
          echo 'Aggregate payload:'
          sha256sum /tmp/time-slip.patch.gz.b64
          test "$(sha256sum /tmp/time-slip.patch.gz.b64 | awk '{print $1}')" = "8bd0470aec9756fb61487f21cb1907f5e538d24a4b887a404520774ea7000641"
          base64 --decode /tmp/time-slip.patch.gz.b64 | gzip --decompress > /tmp/time-slip.patch
          git apply --check /tmp/time-slip.patch
          git apply /tmp/time-slip.patch
          rm -rf ci/time-slip-patch
          rm -f .github/workflows/time-slip-source-snapshot.yml
      - name: Commit Time Slip implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Implement NTU Time Slip performance testing"
          git push origin HEAD:feature/1.7.0-time-slip
