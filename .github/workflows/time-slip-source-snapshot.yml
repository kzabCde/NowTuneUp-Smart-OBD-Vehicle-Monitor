name: Apply Time Slip implementation

on:
  push:
    branches:
      - feature/1.7.0-time-slip
    paths:
      - 'ci/time-slip-patch/**'
      - '.github/workflows/time-slip-source-snapshot.yml'

permissions:
  contents: write

concurrency:
  group: apply-time-slip-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/1.7.0-time-slip
          fetch-depth: 0
      - name: Apply implementation patch
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(ci/time-slip-patch/part-*)
          if (( ${#parts[@]} == 0 )); then
            echo "No patch parts yet."
            exit 0
          fi
          cat "${parts[@]}" > /tmp/time-slip.patch
          git apply --check /tmp/time-slip.patch
          git apply /tmp/time-slip.patch
          rm -rf ci/time-slip-patch
          rm -f .github/workflows/time-slip-source-snapshot.yml
      - name: Commit Time Slip implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Implement NTU Time Slip performance testing"
          git push
