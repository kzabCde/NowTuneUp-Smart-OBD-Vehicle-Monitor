name: Publish Android 1.15.0 once

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-android-1.15.0-once.yml']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    env:
      RELEASE_VERSION: 1.15.0
      RELEASE_NOTES: docs/releases/v1.15.0.md
      NTU_KEYSTORE_FILE: ${{ github.workspace }}/android-app/keystore/nowtuneup-web-release.jks
      NTU_KEYSTORE_PASSWORD: ${{ secrets.NTU_KEYSTORE_PASSWORD }}
      NTU_KEY_ALIAS: ${{ secrets.NTU_KEY_ALIAS }}
      NTU_KEY_PASSWORD: ${{ secrets.NTU_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: chmod +x gradlew
      - name: Validate release and signing prerequisites
        run: |
          set -euo pipefail
          grep -Fq "versionName = \"$RELEASE_VERSION\"" app/build.gradle.kts
          test -f "../$RELEASE_NOTES"
          test -s "$NTU_KEYSTORE_FILE"
          test -n "$NTU_KEYSTORE_PASSWORD"
          test -n "$NTU_KEY_ALIAS"
          test -n "$NTU_KEY_PASSWORD"
      - run: ./gradlew test lint
      - name: Build signed release APK
        run: ./gradlew assembleRelease
      - name: Name and checksum artifact
        working-directory: .
        run: |
          set -euo pipefail
          scripts/rename-apk.sh "$RELEASE_VERSION"
          scripts/calculate-checksum.sh "android-app/app/build/outputs/apk/release/NowTuneUp-v${RELEASE_VERSION}-release.apk"
          scripts/verify-release.sh "android-app/app/build/outputs/apk/release/NowTuneUp-v${RELEASE_VERSION}-release.apk"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.RELEASE_VERSION }}
          name: NowTuneUp v${{ env.RELEASE_VERSION }}
          body_path: ${{ env.RELEASE_NOTES }}
          generate_release_notes: true
          files: |
            android-app/app/build/outputs/apk/release/NowTuneUp-v${{ env.RELEASE_VERSION }}-release.apk
            android-app/app/build/outputs/apk/release/NowTuneUp-v${{ env.RELEASE_VERSION }}-release.apk.sha256
