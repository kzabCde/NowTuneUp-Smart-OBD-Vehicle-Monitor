name: One-time Time Slip import fix
on:
  push:
    branches:
      - release/1.7.2-turbo-timeslip
    paths:
      - .github/workflows/one-time-fix-timeslip-import.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/1.7.2-turbo-timeslip
      - name: Remove invalid internal Compose import
        shell: bash
        run: |
          set -euo pipefail
          FILE="android-app/app/src/main/java/com/nowtuneup/app/feature/timeslip/TimeSlipScreen.kt"
          sed -i '/^import androidx\.compose\.foundation\.layout\.weight$/d' "$FILE"
          ! grep -q '^import androidx\.compose\.foundation\.layout\.weight$' "$FILE"
      - name: Commit source fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-app/app/src/main/java/com/nowtuneup/app/feature/timeslip/TimeSlipScreen.kt
          git diff --cached --quiet && exit 0
          git commit -m "Fix Time Slip Compose weight import"
          git push origin HEAD:release/1.7.2-turbo-timeslip
