<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d"><title id="t">NowTuneUp dashboard</title><desc id="d">Dark vehicle dashboard showing RPM, speed, coolant temperature, voltage and engine load.</desc><rect width="960" height="540" rx="34" fill="#080d12"/><text x="48" y="62" fill="#fff" font-family="sans-serif" font-size="28" font-weight="700">NowTuneUp</text><circle cx="18" cy="-2" r="220" fill="#12323a"/><g font-family="sans-serif"><rect x="48" y="98" width="414" height="280" rx="28" fill="#111b24" stroke="#2b3b46"/><text x="78" y="145" fill="#9caeb8" font-size="18">ENGINE RPM</text><text x="78" y="270" fill="#35d8e6" font-size="100" font-weight="800">2,480</text><text x="80" y="320" fill="#fff" font-size="20">rpm</text><rect x="490" y="98" width="422" height="280" rx="28" fill="#111b24" stroke="#2b3b46"/><text x="520" y="145" fill="#9caeb8" font-size="18">VEHICLE SPEED</text><text x="520" y="270" fill="#fff" font-size="100" font-weight="800">72</text><text x="522" y="320" fill="#fff" font-size="20">km/h</text><g fill="#111b24" stroke="#2b3b46"><rect x="48" y="404" width="270" height="90" rx="20"/><rect x="345" y="404" width="270" height="90" rx="20"/><rect x="642" y="404" width="270" height="90" rx="20"/></g><g fill="#fff" font-size="25" font-weight="700"><text x="75" y="458">89 °C</text><text x="372" y="458">13.8 V</text><text x="669" y="458">32 %</text></g></g></svg>
